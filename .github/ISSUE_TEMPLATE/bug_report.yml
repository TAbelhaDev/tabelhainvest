name: Bug report
description: Reportar um comportamento incorreto no tabelainvest
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: Descreva o bug e o que você esperava que acontecesse em vez disso.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra o screener e filtre por '...'
        2. Navegue até '...'
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Navegador e versão, sistema operacional, URL da página onde o erro aparece.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Cole aqui logs relevantes ou screenshots. Nunca cole chaves de API ou tokens.
    validations:
      required: false
